  <polygon points="174,36 176.5,43 184,43 178,47.5 180.5,54.5 174,50 167.5,54.5 170,47.5 164,43 171.5,43" fill="#F4D03F" opacity="0.85"/>
  <polygon points="26,146 28.5,153 36,153 30,157.5 32.5,164.5 26,160 19.5,164.5 22,157.5 16,153 23.5,153" fill="#F4D03F" opacity="0.85"/>
  <polygon points="174,146 176.5,153 184,153 178,157.5 180.5,164.5 174,160 167.5,164.5 170,157.5 164,153 171.5,153" fill="#F4D03F" opacity="0.85"/>
